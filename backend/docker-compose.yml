services:
  db:
    image: postgres:16
    container_name: examplatform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: examplatform
    ports:
      - "5432:5432"
    volumes:
      - examplatform-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d examplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  examplatform-pgdata: