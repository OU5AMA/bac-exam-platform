spring:
  application:
    name: examplatform
  profiles:
    active: dev
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-32bytesmin}
    access-token-ttl: 15m
    refresh-token-sliding-ttl: 4h
    refresh-token-absolute-ttl: 12h
    cookie-secure: false
