spring:
  app:
    jwt:
      secure-cookies: false
  datasource:
    url: jdbc:postgresql://localhost:5432/examplatform
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false

logging:
  level:
    com.examplatform: DEBUG

management:
  endpoint:
    health:
      show-details: always