spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
              - openid
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
  app:
    jwt:
      secure-cookies: false
  datasource:
    url: jdbc:postgresql://localhost:5432/examplatform
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:meta-llama/llama-3.1-8b-instruct:free}

logging:
  level:
    com.examplatform: DEBUG

management:
  endpoint:
    health:
      show-details: always
app:
  frontend-url: http://localhost:4200
